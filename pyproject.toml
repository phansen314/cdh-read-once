[project]
name = "cdh-read-once"
version = "0.1.0"
description = "CDHP handler: prevent redundant Read tool calls within a Claude Code session"
requires-python = ">=3.11"
dependencies = [
    "cachetools>=5.0",
]

[project.scripts]
cdh-read-once = "cdh_read_once.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cdh_read_once"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "cachetools.*"
ignore_missing_imports = true
