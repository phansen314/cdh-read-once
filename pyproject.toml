[project]
name = "cdh-read-once"
version = "0.1.0"
description = "CDHP handler: prevent redundant Read tool calls within a Claude Code session"
requires-python = ">=3.11"
dependencies = [
    "cachetools>=5.0",
]

[project.scripts]
cdh-read-once = "cdh_read_once.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cdh_read_once"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
